<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --hijau:#0b5e50; --hijau-tua:#084a3f; --hijau-bar:#0a5346; --muda:#dcf8c6;
    --dinding:#e6ddd4; --putih:#fff; --teks:#1f2a28; --redup:#6b7a76; --garis:#d7d0c8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--teks);background:transparent}
  .layar{display:none;height:100%}
  .layar.on{display:flex}

  /* ===== Tombol pembuka ===== */
  #pembuka{align-items:center;justify-content:center;padding:12px}
  .kartu-pembuka{display:flex;align-items:center;gap:14px;width:100%;max-width:420px;padding:28px 22px;
    background:var(--hijau);border-radius:18px;box-shadow:0 10px 26px rgba(8,74,63,.25)}
  .ava{flex:none;width:44px;height:44px;border-radius:50%;background:#1d7a69;display:grid;place-items:center;font-size:20px}
  .pil{flex:1;border:none;border-radius:999px;padding:12px 18px;background:var(--muda);color:var(--hijau-tua);
    font:inherit;font-weight:700;font-size:14px;text-align:left;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .pil:hover{filter:brightness(.97)}

  /* ===== Panel chat ===== */
  #panel{flex-direction:column;max-width:420px;margin:0 auto;width:100%;background:var(--dinding);overflow:hidden}
  .kepala{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--hijau);color:#fff}
  .kembali{border:none;background:none;color:#fff;font-size:26px;line-height:1;padding:0 4px;cursor:pointer}
  .kepala .ava{width:40px;height:40px}
  .kepala b{display:block;font-size:15px}
  .kepala small{font-size:12px;opacity:.85}
  .identitas{display:flex;gap:8px;padding:8px 12px;background:var(--hijau-bar)}
  .identitas input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:7px 9px;
    background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:12.5px}
  .identitas input::placeholder{color:rgba(255,255,255,.65)}
  .identitas input:focus{outline:none;border-color:rgba(255,255,255,.55)}
  .identitas input.wajib{border-color:#ffb4a8;background:rgba(255,120,100,.18)}
  .identitas input[readonly]{opacity:.8}
  #aliran{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:8px}
  .gel{position:relative;max-width:84%;padding:8px 10px 18px;border-radius:10px;font-size:14.5px;line-height:1.45;
    word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .gel .jam{position:absolute;right:8px;bottom:3px;font-size:10.5px;color:var(--redup)}
  .tutor{align-self:flex-start;background:var(--putih);border-top-left-radius:2px}
  .saya{align-self:flex-end;background:var(--muda);border-top-right-radius:2px}
  .sistem{align-self:center;max-width:92%;padding:6px 10px;background:#fff3cd;color:#7a5a00;font-size:12.5px;border-radius:8px;text-align:center}
  .mengetik{align-self:flex-start;background:var(--putih);border-radius:10px;padding:10px 12px;display:flex;gap:4px}
  .mengetik i{width:6px;height:6px;border-radius:50%;background:#9aa8a4;animation:loncat 1s infinite}
  .mengetik i:nth-child(2){animation-delay:.15s}.mengetik i:nth-child(3){animation-delay:.3s}
  @keyframes loncat{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
  .tulis{display:flex;align-items:flex-end;gap:10px;padding:10px 12px;background:#f0ebe6}
  .tulis textarea{flex:1;resize:none;border:none;border-radius:22px;padding:11px 16px;font:inherit;font-size:14.5px;
    line-height:1.4;height:44px;max-height:110px;background:#fff;color:var(--teks)}
  .tulis textarea:focus{outline:2px solid rgba(11,94,80,.25)}
  .kirim{flex:none;width:46px;height:46px;border:none;border-radius:50%;background:var(--hijau);color:#fff;font-size:18px;cursor:pointer}
  .kirim:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>

<!-- TOMBOL PEMBUKA (tampilan awal di LKPD) -->
<section class="layar on" id="pembuka">
  <div class="kartu-pembuka">
    <div class="ava">📊</div>
    <button class="pil" id="buka">Tanya Tutor AI Sobat Data yukk...</button>
  </div>
</section>

<!-- PANEL CHAT -->
<section class="layar" id="panel">
  <div class="kepala">
    <button class="kembali" id="kembali" title="Kembali ke halaman awal" aria-label="Kembali ke halaman awal">&#8592;</button>
    <div class="ava">📊</div>
    <div><b>Tutor AI Sobat Data</b><small id="status">online</small></div>
  </div>
  <div class="identitas">
    <input id="nama" placeholder="Nama / Kelompok" maxlength="60" autocomplete="off" />
    <input id="kelas" placeholder="Kelas (mis. 8A)" maxlength="20" autocomplete="off" />
  </div>
  <div id="aliran" aria-live="polite"></div>
  <div class="tulis">
    <textarea id="pesan" rows="1" placeholder="Ketik pesan..." maxlength="1500"></textarea>
    <button class="kirim" id="kirim" title="Kirim" aria-label="Kirim">&#10148;</button>
  </div>
</section>

<script>
  /* ====== PENGATURAN (isi sekali) ====== */
  var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbw6rIa8Jd3pQGOTxgTir2rR2KR-iXhqbXZRD1qCyNRVSL2CkK3weSqHKEK95fs52Gt6/exec';   // URL web app Apps Script (berakhiran /exec)
  var APP_TOKEN   = '';                                    // isi sama dengan SECRET_TOKEN jika dipakai
  /* ===================================== */
  var q = new URLSearchParams(location.search).get('aktivitas');
  var AKTIVITAS = ['1','2','3','4'].indexOf(q) >= 0 ? q : '1';
  document.getElementById('status').textContent = 'online · Aktivitas ' + AKTIVITAS;
  document.title = 'Tutor AI Sobat Data – Aktivitas ' + AKTIVITAS;
  // role: 'model' = Sobat Data, 'user' = siswa, 'sys' = pemberitahuan (tidak dikirim ke AI)
  var S = { sesi:'', pesan:[], sibuk:false, terkunci:false };

  function $(id){ return document.getElementById(id); }
  function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
  function jam(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

  function gambar(){
    var a=$('aliran'); a.innerHTML='';
    S.pesan.forEach(function(m){
      var d=document.createElement('div');
      if(m.role==='sys'){ d.className='sistem'; d.innerHTML=fmt(m.text); }
      else {
        d.className='gel '+(m.role==='model'?'tutor':'saya');
        d.innerHTML=fmt(m.text)+'<span class="jam">'+m.jam+'</span>';
      }
      a.appendChild(d);
    });
    if(S.sibuk){ var t=document.createElement('div'); t.className='mengetik'; t.innerHTML='<i></i><i></i><i></i>'; a.appendChild(t); }
    a.scrollTop=a.scrollHeight;
  }

  function tampil(id){
    $('pembuka').classList.toggle('on', id==='pembuka');
    $('panel').classList.toggle('on', id==='panel');
  }

  $('buka').onclick=function(){
    if(!S.pesan.length){
      S.pesan.push({role:'model', jam:jam(), text:'Halo sobat data! 👋 Isi nama/kelompok dan kelas di atas, lalu ceritakan kamu sedang di Kegiatan berapa, ya.'});
    }
    tampil('panel'); gambar();
    ($('nama').value ? $('pesan') : $('nama')).focus();
  };
  $('kembali').onclick=function(){ tampil('pembuka'); };

  function cekIdentitas(){
    var ok=true;
    ['nama','kelas'].forEach(function(id){
      var el=$(id), kosong=!el.value.trim();
      el.classList.toggle('wajib', kosong);
      if(kosong) ok=false;
    });
    return ok;
  }
  ['nama','kelas'].forEach(function(id){
    $(id).addEventListener('input', function(){ this.classList.remove('wajib'); });
  });

  function kirim(){
    var inp=$('pesan'), teks=inp.value.trim();
    if(!teks || S.sibuk) return;
    if(!cekIdentitas()){
      S.pesan.push({role:'sys', text:'Isi nama/kelompok dan kelas di bagian atas dulu, ya.'});
      gambar(); return;
    }
    if(!S.terkunci){
      // Identitas dikunci setelah pesan pertama agar catatan untuk guru tetap konsisten.
      S.terkunci=true;
      ['nama','kelas'].forEach(function(id){ $(id).readOnly=true; });
      S.sesi='A'+AKTIVITAS+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);
    }
    inp.value=''; inp.style.height='44px';
    var milikku={role:'user', jam:jam(), text:teks};
    S.pesan.push(milikku);
    S.sibuk=true; $('kirim').disabled=true; gambar();

    function selesai(){ S.sibuk=false; $('kirim').disabled=false; inp.focus(); }
    function gagal(t){ milikku.gagal=true; S.pesan.push({role:'sys', text:t}); }

    var payload = {
      token:APP_TOKEN, aktivitas:AKTIVITAS, session:S.sesi,
      name:$('nama').value.trim(), klass:$('kelas').value.trim(), group:'',
      // sapaan pembuka dan pemberitahuan tidak dikirim; pesan yang gagal juga tidak
      messages:S.pesan.filter(function(m){ return (m.role==='user'||m.role==='model') && !m.gagal; })
                      .map(function(m){ return {role:m.role, text:m.text}; })
    };
    // Content-Type text/plain agar tidak perlu preflight CORS ke Apps Script
    fetch(BACKEND_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) })
      .then(function(res){ return res.json(); })
      .then(function(r){
        selesai();
        if(r && r.ok){ S.pesan.push({role:'model', jam:jam(), text:r.reply}); }
        else { gagal((r && r.reply) || 'Maaf, coba kirim lagi ya.'); }
        gambar();
      })
      .catch(function(){
        selesai(); gagal('Maaf, koneksi terganggu. Coba kirim lagi sebentar ya.'); gambar();
      });
  }
  $('kirim').onclick=kirim;
  $('pesan').addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); kirim(); } });
  $('pesan').addEventListener('input', function(){ this.style.height='44px'; this.style.height=Math.min(this.scrollHeight,110)+'px'; });
</script>
</body>
</html>
