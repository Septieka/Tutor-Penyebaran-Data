<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Boxplot - Data Sina Belajar</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #222222;
    margin: 0;
    padding: 12px;
  }
  .wrap { max-width: 420px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; margin-bottom: 8px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }
  .field label {
    display: block;
    font-size: 9px;
    color: #888888;
    margin-bottom: 2px;
    text-align: center;
  }
  .field input {
    width: 100%;
    text-align: center;
    padding: 4px 2px;
    border: 1px solid #cccccc;
    border-radius: 5px;
    font-size: 12px;
    background: #fafafa;
  }
  .field input:focus {
    outline: none;
    border-color: #888888;
    background: #ffffff;
  }
</style>
</head>
<body>
<div class="wrap">
  <svg id="ax" viewBox="0 0 680 200" role="img">
    <title>Sumbu boxplot</title>
    <line x1="60" y1="150" x2="620" y2="150" stroke="#999999" stroke-width="1"/>
    <g id="ticks"></g>
    <g id="plot"></g>
  </svg>

  <div class="grid">
    <div class="field"><label>Min</label><input type="number" id="v0" placeholder="..."></div>
    <div class="field"><label>Q1</label><input type="number" id="v1" placeholder="..."></div>
    <div class="field"><label>Q2</label><input type="number" id="v2" placeholder="..."></div>
    <div class="field"><label>Q3</label><input type="number" id="v3" placeholder="..."></div>
    <div class="field"><label>Max</label><input type="number" id="v4" placeholder="..."></div>
  </div>
</div>

<script>
  const x0 = 60, x1 = 620;

  function niceStep(range){
    const rough = range / 6;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    let step;
    if(norm < 1.5) step = 1;
    else if(norm < 3) step = 2;
    else if(norm < 7) step = 5;
    else step = 10;
    return step * mag;
  }

  function getScale(){
    const minInput = parseFloat(document.getElementById('v0').value);
    const maxInput = parseFloat(document.getElementById('v4').value);
    let lo = 0, hi = 10;
    if(!isNaN(minInput) && !isNaN(maxInput) && maxInput > minInput){
      const pad = (maxInput - minInput) * 0.15 || 1;
      lo = minInput - pad;
      hi = maxInput + pad;
    } else if(!isNaN(minInput)){
      lo = minInput - 5; hi = minInput + 5;
    } else if(!isNaN(maxInput)){
      lo = maxInput - 5; hi = maxInput + 5;
    }
    return { lo, hi };
  }

  function scaleX(v, lo, hi){ return x0 + (v-lo)/(hi-lo)*(x1-x0); }

  function drawTicks(lo, hi){
    const step = niceStep(hi - lo);
    const start = Math.ceil(lo / step) * step;
    const ticksG = document.getElementById('ticks');
    ticksG.innerHTML = '';
    for(let t = start; t <= hi; t += step){
      const x = scaleX(t, lo, hi);
      const label = Math.round(t * 100) / 100;
      ticksG.innerHTML += '<line x1="'+x+'" y1="145" x2="'+x+'" y2="155" stroke="#999999" stroke-width="1"/>' +
        '<text x="'+x+'" y="172" text-anchor="middle" font-size="12" fill="#666666">'+label+'</text>';
    }
  }

  function draw(){
    const { lo, hi } = getScale();
    drawTicks(lo, hi);

    const ids = ['v0','v1','v2','v3','v4'];
    const vals = ids.map(id => parseFloat(document.getElementById(id).value));
    const plot = document.getElementById('plot');
    if(vals.some(v => isNaN(v))){ plot.innerHTML = ''; return; }
    const [min,q1,q2,q3,max] = vals;
    const y = 110, h = 50;
    const xMin = scaleX(min, lo, hi), xQ1 = scaleX(q1, lo, hi), xQ2 = scaleX(q2, lo, hi),
          xQ3 = scaleX(q3, lo, hi), xMax = scaleX(max, lo, hi);
    plot.innerHTML =
      '<line x1="'+xMin+'" y1="'+(y+h/2)+'" x2="'+xQ1+'" y2="'+(y+h/2)+'" stroke="#333333" stroke-width="2"/>' +
      '<line x1="'+xMin+'" y1="'+y+'" x2="'+xMin+'" y2="'+(y+h)+'" stroke="#333333" stroke-width="2"/>' +
      '<rect x="'+Math.min(xQ1,xQ3)+'" y="'+y+'" width="'+Math.abs(xQ3-xQ1)+'" height="'+h+'" fill="none" stroke="#333333" stroke-width="2"/>' +
      '<line x1="'+xQ2+'" y1="'+y+'" x2="'+xQ2+'" y2="'+(y+h)+'" stroke="#333333" stroke-width="2"/>' +
      '<line x1="'+xQ3+'" y1="'+(y+h/2)+'" x2="'+xMax+'" y2="'+(y+h/2)+'" stroke="#333333" stroke-width="2"/>' +
      '<line x1="'+xMax+'" y1="'+y+'" x2="'+xMax+'" y2="'+(y+h)+'" stroke="#333333" stroke-width="2"/>';
  }

  drawTicks(0, 10);
  ['v0','v1','v2','v3','v4'].forEach(id => document.getElementById(id).addEventListener('input', draw));
</script>
</body>
</html>
